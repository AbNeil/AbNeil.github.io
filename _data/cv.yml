        date: 2024-03-03
        journal: Human-Centric Intelligent Systems
        url: https://doi.org/10.1007/s44230-023-00060-0
        summary: "A data-driven framework called TCRSCANet combining temporal convolution, recurrent skip components, and an attention mechanism for RUL prediction."

